name: Build luci-app-floatip APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-floatip-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout apkstore
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git rsync wget zstd python3 \
            unzip file libncurses-dev gawk

      - name: Download ImmortalWrt 25.12 x86-64 SDK
        run: |
          wget -O sdk.tar.zst \
            'https://downloads.immortalwrt.org/releases/25.12-SNAPSHOT/targets/x86/64/immortalwrt-sdk-25.12-SNAPSHOT-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst'

          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Get original floatip source
        run: |
          git clone --depth=1 --filter=blob:none --sparse -b master \
            https://github.com/linkease/nas-packages.git source-nas
          git -C source-nas sparse-checkout set network/services/floatip

          git clone --depth=1 --filter=blob:none --sparse -b main \
            https://github.com/linkease/nas-packages-luci.git source-luci
          git -C source-luci sparse-checkout set luci/luci-app-floatip

          cp -a source-nas/network/services/floatip sdk/package/floatip
          cp -a source-luci/luci/luci-app-floatip sdk/package/luci-app-floatip

          test -f sdk/package/floatip/files/floatip.sh
          test -f sdk/package/luci-app-floatip/Makefile

      - name: Prepare SDK and compile APK
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p packages
          ./scripts/feeds install -a -p luci

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_floatip=m
          CONFIG_PACKAGE_luci-app-floatip=m
          CONFIG_PACKAGE_luci-i18n-floatip-zh-cn=m
          EOF

          make defconfig

          grep -qx 'CONFIG_PACKAGE_floatip=m' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-floatip=m' .config
          grep -qx 'CONFIG_PACKAGE_luci-i18n-floatip-zh-cn=m' .config

          make package/floatip/compile V=s
          make package/luci-app-floatip/compile V=s

      - name: Copy APK to run/x86/luci-app-floatip
        run: |
          target='run/x86/luci-app-floatip'
          mkdir -p "$target"

          # 清理此插件以前编译的 APK，避免旧版本与新版本并存
          find "$target" -maxdepth 1 -type f -name '*.apk' -delete

          find sdk/bin/packages -type f -name '*floatip*.apk' \
            -exec cp -v {} "$target/" \;

          test -n "$(find "$target" -maxdepth 1 -name 'floatip*.apk' -print -quit)"
          test -n "$(find "$target" -maxdepth 1 -name 'luci-app-floatip*.apk' -print -quit)"
          test -n "$(find "$target" -maxdepth 1 -name 'luci-i18n-floatip-zh-cn*.apk' -print -quit)"

          ls -lh "$target"

      - name: Commit APK to apkstore
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A -- run/x86/luci-app-floatip

          if git diff --cached --quiet; then
            echo 'APK 未变化，无需提交。'
            exit 0
          fi

          git commit -m 'Update floatip APK for ImmortalWrt 25.12 x86-64'
          git push origin HEAD:main
